name:       rdf-query-dsl-interpreter
version:    0.1.0.0
license:    BSD-3-Clause
author:     "Tharun Selva, Nicholas Escobar Gomez, Sade Sheikh"
maintainer: "Group 67"

# Metadata used when publishing your package:
# synopsis: Short description of your package
# category: Web

dependencies:
  - base >= 4.7 && < 5
  - array
  - containers
  - filepath
  - directory
  - text

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  verbatim: |
    build-tool-depends:
      alex:alex,
      happy:happy

executables:
  rdf-query-dsl-interpreter:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - rdf-query-dsl-interpreter